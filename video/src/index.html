<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Les Vertus du Sidr — motion</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  body.preview canvas { height: 100vh; width: auto; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="scene.js"></script>
<script>
  // Preview only (?play): loops the timeline in real time. The renderer never uses this path;
  // it calls window.seek(t) for every frame.
  if (new URLSearchParams(location.search).has('play')) {
    document.body.classList.add('preview');
    window.ready.then(() => {
      const t0 = performance.now();
      const loop = () => { window.seek(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); };
      loop();
    });
  }
</script>
</body>
</html>
